name: Build and deploy reading site

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/validate_site.py'
      - 'scripts/build_articles.py'
      - 'requirements-site.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'articles/**'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/validate_site.py'
      - 'requirements-site.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site and publishing dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-site.txt
          python3 -m pip install --disable-pip-version-check python-docx reportlab
      - name: Install open-source Chinese PDF font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gbsn00lp
      - name: Rebuild PDF and Word from canonical Markdown
        run: python3 scripts/build_articles.py
      - name: Generate static HTML reading site
        run: |
          python3 scripts/build_site.py \
            --repo '1998x-stack/YuHan-articles' \
            --site-url 'https://1998x-stack.github.io/YuHan-articles/'
      - name: Validate rendered HTML, links and assets
        run: |
          python3 scripts/validate_site.py --base-path '/YuHan-articles/' --min-articles 1
      - name: Upload static site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages (requires Pages enabled)
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
