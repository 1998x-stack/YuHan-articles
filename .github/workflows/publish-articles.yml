name: Publish article formats
on:
  push:
    branches: [main]
    paths:
      - 'articles/**/*.md'
      - 'articles/**/article.json'
      - 'scripts/build_articles.py'
      - 'scripts/build_catalog.py'
      - 'scripts/validate_repository.py'
      - '.github/workflows/publish-articles.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-articles-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source metadata and documentation links
        run: python3 scripts/validate_repository.py
      - name: Install Chinese fonts and publishing libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gbsn00lp
          python3 -m pip install --disable-pip-version-check python-docx reportlab
      - name: Test font resolution and PDF fallback
        run: python3 -m unittest discover -s tests -p 'test_fonts.py'
      - name: Build Word and PDF from canonical Markdown
        run: python3 scripts/build_articles.py
      - name: Reconcile latest source and publish generated documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            # Never rebase binary PDF/DOCX. Rebuild from the latest Markdown.
            git reset --hard origin/main
            python3 scripts/build_articles.py
            python3 scripts/build_catalog.py
            python3 scripts/validate_repository.py --require-exports
            git add articles
            if git diff --cached --quiet; then
              echo "All publications and the catalog are current."
              exit 0
            fi
            git commit -m "docs: regenerate article publications and catalog [skip ci]"
            if git push origin HEAD:main; then
              echo "Published generated documents without rebasing binaries."
              exit 0
            fi
            echo "Branch advanced; rebuilding from latest manuscript ($attempt/4)"
            sleep 2
          done
          echo "Could not push generated publications after retries."
          exit 1
