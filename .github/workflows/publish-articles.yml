name: Publish article formats
on:
  push:
    branches: [main]
    paths:
      - 'articles/**/*.md'
      - 'articles/**/article.json'
      - 'scripts/build_articles.py'
      - '.github/workflows/publish-articles.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-articles-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chinese fonts and publishing libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gbsn00lp
          python3 -m pip install --disable-pip-version-check python-docx reportlab
      - name: Build Word and PDF from canonical Markdown
        run: python3 scripts/build_articles.py
      - name: Commit generated publications
        run: |
          if [ -n "$(git status --porcelain -- articles)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- articles
            git commit -m "docs: generate PDF and Word article publications [skip ci]"
            # Another article may be committed while this job is building.
            # Keep generated files, rebase on the latest main, and push safely.
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published generated article formats."
                exit 0
              fi
              echo "Concurrent update detected (attempt ${attempt}); retrying."
              sleep 3
            done
            echo "Publishing failed after six safe retries." >&2
            exit 1
          else
            echo "No generated changes."
          fi
